name: tests

on:
  push:
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: node --test engine.test.js bolero.test.js saxo.test.js
      - name: index.html is up to date with the sources
        run: |
          python3 build.py
          git diff --exit-code -- index.html || (echo "Draai 'python3 build.py' en commit index.html" && exit 1)

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
